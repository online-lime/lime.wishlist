function sendCode(){const ph=($('phone')?.value||'').replace(/\D/g,'');if(ph.length!==11||ph[0]!=='7'){state.error='Введите номер телефона в формате +7 999 123-45-67.';render();return}state.phone=ph;state.error='';navigate('otp')}

function removeItem(id){state.items=state.items.filter(x=>x.id!==+id);persist();render()}function editItem(id){state.selected=+id;const item=state.items.find(x=>x.id===+id);state.color=item.color;state.size=item.size;state.editing=id;navigate('product')}
function setColor(i){state.color=i;state.error='';render()}function setSize(s){state.size=s;state.error='';render()}function setPrivacy(v){state.sharePublic=v;persist();render()}async function copyLink(){try{await navigator.clipboard.writeText(qs());toast('Ссылка скопирована')}catch(e){const x=document.createElement('textarea');x.value=qs();document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Ссылка скопирована')}}async function share(){if(navigator.share){try{await navigator.share({title:'Мой вишлист LIMÉ',text:'Я собрала вещи, которые мне нравятся',url:qs()})}catch(e){}}else copyLink()}
function viewGiftItem(id){state.giftItem=+id;navigate('gift-item')}function goCheckout(){const p=get(state.giftItem),item=state.items.find(x=>x.id===state.giftItem);if(!p||!item){navigate('gift');return}if(state.unavailable){state.error='Выбранный размер временно недоступен. Вернитесь к списку и выберите другую вещь.';render();return}navigate('checkout')}
function submitOrder(){const name=$('buyer-name')?.value.trim(),email=$('buyer-email')?.value.trim(),address=$('address')?.value.trim(),agree=$('agree')?.checked;if(!name||!email||!email.includes('@')||!address||!agree){state.error='Заполните имя, электронную почту, адрес и подтвердите согласие.';render();return}state.payment=true;navigate('done')}
