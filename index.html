<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIMÉ — Wishlist · интерактивный прототип</title><style>
:root{--ink:#191919;--paper:#faf9f6;--muted:#77746f;--border:#dddcd6;--accent:#d9e5d8;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.top{height:80px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #e9e8e4;position:sticky;top:0;z-index:10}.logo{font-size:37px;letter-spacing:-3.5px;font-weight:600;line-height:1}.toplinks{display:flex;gap:24px;align-items:center}.textbtn{background:none;border:none;padding:6px 0;color:#333}.textbtn:hover{text-decoration:underline}.count{display:inline-grid;place-items:center;border:1px solid #333;border-radius:50%;font-size:10px;min-width:17px;height:17px}.shell{max-width:1280px;margin:0 auto;padding:28px 48px 70px}.crumbs{color:#827f7a;font-size:12px;margin:0 0 27px}.crumbs button{color:inherit;border:0;background:none;padding:0}.crumbs button:hover{text-decoration:underline}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:6%;align-items:start}.hero-photo{height:560px;overflow:hidden;background:#e8e5de}.hero-photo img,.tile img,.product-photo img,.mini-img img{width:100%;height:100%;object-fit:cover;display:block}.product-photo{height:540px;background:#eceae4;overflow:hidden}.panel{padding-top:22px}.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#777;margin-bottom:18px}.h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.8vw,67px);line-height:1.08;letter-spacing:-1.8px;margin:0 0 25px}.h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.5vw,47px);line-height:1.12;margin:0 0 22px}.lead{font-size:16px;line-height:1.8;color:#514f4b;max-width:520px}.fine{font-size:12px;color:#8b8985}.btn{width:100%;border:1px solid #171717;background:#171717;color:#fff;padding:16px 18px;letter-spacing:.25px;min-height:51px;transition:.18s}.btn:hover{background:#444}.btn.secondary{background:transparent;color:#171717}.btn.secondary:hover{background:#ededea}.btn.soft{background:#e2e9de;border-color:#e2e9de;color:#171717}.btnrow{display:flex;gap:10px;margin-top:23px}.btnrow .btn{width:auto;flex:1}.stepbox{border-top:1px solid var(--border);padding-top:24px;margin-top:30px}.meta{color:#7d7b75;font-size:12px;letter-spacing:.5px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.tile{cursor:pointer}.tile img{height:350px;background:#e6e1db}.tile:hover img{filter:brightness(.97)}.tile-name{margin:12px 0 5px;font-size:13px}.tile-price{font-size:13px;color:#69665f}.select-label{font-size:12px;margin:29px 0 11px;display:flex;justify-content:space-between}.swatches,.sizes{display:flex;gap:11px;flex-wrap:wrap}.swatch{height:29px;width:29px;border:1px solid #e0ded9;border-radius:50%;outline:2px solid transparent;outline-offset:3px}.swatch.selected{outline-color:#151515}.size{min-width:54px;height:44px;padding:0 12px;border:1px solid #d9d7d1;background:none}.size.selected{border-color:#111;background:#161616;color:#fff}.error{padding:12px 15px;background:#f8e9e7;color:#a13d34;margin-top:14px;font-size:13px;border-left:3px solid #c96b61}.success-msg{background:#e8eee5;color:#334936;padding:12px 15px;margin-top:15px}.input{height:53px;width:100%;border:1px solid #ceccc5;background:#fff;padding:0 15px;outline:0;margin:10px 0}.input:focus{border-color:#171717}.authcard{max-width:520px;margin:55px auto 0;background:#fff;padding:55px 57px;border:1px solid #eeeae4}.empty{padding:70px 24px;text-align:center;border:1px solid var(--border);margin-top:26px}.wish-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;margin-top:30px}.wish-card{background:#fff;border:1px solid #eae8e1}.wish-card .mini-img{height:280px;background:#e9e7e2}.wish-content{padding:17px}.wish-content strong{font-weight:500}.card-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:13px}.linkish{background:none;border:0;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:12px;color:#555}.pill{display:inline-block;border:1px solid #ccc9c0;padding:5px 11px;font-size:11px;letter-spacing:.3px}.wish-actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-top:26px;padding:25px 0;border-top:1px solid var(--border)}.wish-actions .btn{width:auto;min-width:240px}.sharebox{border:1px solid #dfddd5;background:#fff;padding:28px;max-width:680px;margin-top:25px}.urlbox{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:17px;background:#f5f4f1;border:1px solid #e6e4de;font-size:13px}.gift-head{background:#f1f0eb;text-align:center;padding:64px 22px;margin:-28px -48px 35px}.gift-head .h1{font-size:48px}.checkout{max-width:1020px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:50px}.summary{background:#f0efea;padding:27px;align-self:start}.order-row{display:flex;gap:16px;border-bottom:1px solid #dad8d1;padding-bottom:20px}.order-row .mini-img{height:136px;width:100px;flex:none}.total{display:flex;justify-content:space-between;margin-top:22px;font-size:17px}.checkline{display:flex;align-items:flex-start;gap:10px;margin:20px 0;font-size:12px;color:#5b5853}.checkline input{margin-top:3px}.done{text-align:center;max-width:650px;margin:95px auto}.done-symbol{font-size:48px;margin-bottom:20px}.foot{padding:30px 5%;border-top:1px solid var(--border);font-size:11px;color:#928e86;display:flex;gap:20px;justify-content:space-between}.proto{position:fixed;bottom:14px;right:14px;background:#1f1f1f;color:#fff;border-radius:3px;padding:10px 13px;z-index:20;font-size:11px;box-shadow:0 5px 24px #0002;display:flex;align-items:center;gap:12px}.proto button{border:1px solid #aaa;color:white;background:none;padding:5px 8px;font-size:11px}.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#161616;color:#fff;padding:13px 20px;z-index:30;box-shadow:0 6px 30px #0002}.row{display:flex;gap:15px;flex-wrap:wrap}.micro{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#888}.notice{padding:13px 15px;background:#f0eee7;font-size:12px;color:#625e55;margin-top:20px}@media(max-width:800px){.top{height:65px;padding:0 5%}.logo{font-size:29px}.toplinks{gap:12px;font-size:12px}.shell{padding:20px 20px 80px}.layout,.checkout{grid-template-columns:1fr;gap:18px}.hero-photo{height:410px}.product-photo{height:430px}.panel{padding-top:8px}.h1{font-size:43px}.h2{font-size:34px}.catalog,.wish-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile img{height:270px}.wish-card .mini-img{height:220px}.gift-head{margin:-20px -20px 28px;padding:40px 16px}.gift-head .h1{font-size:37px}.authcard{padding:31px 23px;margin:28px auto}.proto{left:9px;right:9px;justify-content:space-between}.foot{padding-bottom:85px}.btnrow{flex-wrap:wrap}.btnrow .btn{min-width:180px}}@media(max-width:440px){.catalog,.wish-grid{gap:11px}.tile img{height:210px}.wish-card .mini-img{height:180px}.wish-content{padding:12px}.toplinks .hide-mobile{display:none}}
</style></head><body><header class="top"><button class="textbtn logo" onclick="navigate('welcome')" aria-label="LIMÉ главная">LIMÉ</button><div class="toplinks"><button class="textbtn hide-mobile" onclick="navigate('catalog')">КОЛЛЕКЦИЯ</button><button class="textbtn" onclick="navigate('wishlist')">ВИШЛИСТ <span class="count" id="count">0</span></button><button class="textbtn" onclick="navigate('auth')">◯</button></div></header><main class="shell" id="app" aria-live="polite"></main><footer class="foot"><span>LIMÉ · концепт функции «Вишлист»</span><span>Учебный интерактивный прототип. Не официальный сайт магазина. Покупки и SMS имитируются.</span></footer><div class="proto"><span>ДЕМО · <span id="stage">01 / 08</span></span><button onclick="resetDemo()">Начать заново</button><button onclick="navigate('gift')">Роль дарителя ↗</button></div><script>
const products=[{id:1,name:'Джемпер с открытыми плечами',price:5999,img:'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=900&auto=format&fit=crop&q=85',colors:[['Бордовый','#762f39'],['Молочный','#e9dfd0'],['Чёрный','#272323']],sizes:['XS','S','M','L']},{id:2,name:'Платье миди с драпировкой',price:8999,img:'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=900&auto=format&fit=crop&q=85',colors:[['Чёрный','#292929'],['Кофейный','#806c60']],sizes:['XS','S','M','L']},{id:3,name:'Жакет прямого кроя',price:10999,img:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=900&auto=format&fit=crop&q=85',colors:[['Серый','#aaa7a4'],['Бежевый','#d3c4ab']],sizes:['XS','S','M','L','XL']},{id:4,name:'Сумка с короткими ручками',price:6499,img:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900&auto=format&fit=crop&q=85',colors:[['Коричневый','#7d5746'],['Чёрный','#262626']],sizes:['ONE SIZE']},{id:5,name:'Рубашка свободного кроя',price:4999,img:'https://images.unsplash.com/photo-1598554747436-c9293d6a588f?w=900&auto=format&fit=crop&q=85',colors:[['Белый','#f3f1e8'],['Голубой','#b2c6d4']],sizes:['XS','S','M','L']},{id:6,name:'Юбка миди',price:5499,img:'https://images.unsplash.com/photo-1583496661160-fb5886a13d27?w=900&auto=format&fit=crop&q=85',colors:[['Чёрный','#252525'],['Серый','#9d9892']],sizes:['XS','S','M','L']}];
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽', get=id=>products.find(x=>x.id===+id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={page:'welcome',selected:1,color:null,size:null,items:[],auth:false,phone:'',code:'',error:'',sharePublic:false,editing:null,giftItem:null,unavailable:false,payment:false};try{const saved=JSON.parse(localStorage.getItem('lime-wishlist-demo')||'null');if(saved){state.items=saved.items||[];state.auth=!!saved.auth;state.phone=saved.phone||'';state.sharePublic=!!saved.sharePublic}}catch(e){}function persist(){localStorage.setItem('lime-wishlist-demo',JSON.stringify({items:state.items,auth:state.auth,phone:state.phone,sharePublic:state.sharePublic}))}function qs(){return window.location.href.split('?')[0].split('#')[0]+'?view=gift&items='+encodeURIComponent(JSON.stringify(state.items))}function crumb(t){return `<div class="crumbs"><button onclick="navigate('welcome')">Главная</button> &nbsp;/&nbsp; ${t}</div>`}function img(p){return `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.opacity='.15'">`}function toast(t){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}function navigate(page){state.page=page;state.error='';if(page==='gift'&&state.items.length)state.giftItem=state.items[0].id;history.replaceState(null,'',page==='gift'?'?view=gift':'?view=owner');render();scrollTo({top:0,behavior:'instant'})}function product(id){state.selected=id;state.color=null;state.size=null;state.editing=null;navigate('product')}function start(){navigate('catalog')}
function saveItem(){if(state.color===null||!state.size){state.error='Выберите цвет и размер, чтобы сохранить вещь в вишлист.';render();return}const item={id:state.selected,color:state.color,size:state.size};const index=state.items.findIndex(x=>x.id===item.id);if(index>=0)state.items[index]=item;else state.items.push(item);persist();state.error='';if(state.auth){toast('Вещь добавлена в ваш вишлист');navigate('wishlist')}else navigate('auth')}
function sendCode(){const ph=($('phone')?.value||'').replace(/\D/g,'');if(ph.length!==11||ph[0]!=='7'){state.error='Введите номер телефона в формате +7 999 123-45-67.';render();return}state.phone=ph;state.error='';navigate('otp')}
function checkCode(){const code=($('code')?.value||'').trim();if(code!=='1234'){state.error='Код неверный или истёк. Попробуйте ещё раз. Для демо используйте 1234.';render();return}state.auth=true;persist();navigate('wishlist')}
function removeItem(id){state.items=state.items.filter(x=>x.id!==+id);persist();render()}function editItem(id){state.selected=+id;const item=state.items.find(x=>x.id===+id);state.color=item.color;state.size=item.size;state.editing=id;navigate('product')}
function setColor(i){state.color=i;state.error='';render()}function setSize(s){state.size=s;state.error='';render()}function setPrivacy(v){state.sharePublic=v;persist();render()}async function copyLink(){try{await navigator.clipboard.writeText(qs());toast('Ссылка скопирована')}catch(e){const x=document.createElement('textarea');x.value=qs();document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Ссылка скопирована')}}async function share(){if(navigator.share){try{await navigator.share({title:'Мой вишлист LIMÉ',text:'Я собрала вещи, которые мне нравятся',url:qs()})}catch(e){}}else copyLink()}
function viewGiftItem(id){state.giftItem=+id;navigate('gift-item')}function goCheckout(){const p=get(state.giftItem),item=state.items.find(x=>x.id===state.giftItem);if(!p||!item){navigate('gift');return}if(state.unavailable){state.error='Выбранный размер временно недоступен. Вернитесь к списку и выберите другую вещь.';render();return}navigate('checkout')}
function submitOrder(){const name=$('buyer-name')?.value.trim(),email=$('buyer-email')?.value.trim(),address=$('address')?.value.trim(),agree=$('agree')?.checked;if(!name||!email||!email.includes('@')||!address||!agree){state.error='Заполните имя, электронную почту, адрес и подтвердите согласие.';render();return}state.payment=true;navigate('done')}
function resetDemo(){if(!confirm('Очистить демо-вишлист и начать сценарий сначала?'))return;localStorage.removeItem('lime-wishlist-demo');state={page:'welcome',selected:1,color:null,size:null,items:[],auth:false,phone:'',code:'',error:'',sharePublic:false,editing:null,giftItem:null,unavailable:false,payment:false};navigate('welcome')}
function render(){const a=$('app');$('count').textContent=state.items.length;let h='';const p=get(state.selected);const stages={welcome:'01 / 08',catalog:'02 / 08',product:'03 / 08',auth:'04 / 08',otp:'04 / 08',wishlist:'05 / 08',share:'05 / 08',gift:'06 / 08','gift-item':'07 / 08',checkout:'08 / 08',done:'ГОТОВО'};$('stage').textContent=stages[state.page]||'ДЕМО';
if(state.page==='welcome')h=`${crumb('Вишлист')}<section class="layout"><div class="hero-photo"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200&auto=format&fit=crop&q=85" alt="Модная коллекция одежды"></div><div class="panel"><div class="kicker">LIMÉ · WISHLIST</div><h1 class="h1">То, что хочется<br>получить в подарок</h1><p class="lead">Сохраняйте любимые вещи в одном месте — сразу с нужным цветом и размером. Поделитесь списком с близкими, чтобы они точно знали, что вам подарить.</p><div style="max-width:380px;margin-top:37px"><button class="btn" onclick="start()">СОЗДАТЬ ВИШЛИСТ</button><button class="btn secondary" style="margin-top:11px" onclick="navigate('gift')">Я выбираю подарок</button></div><div class="stepbox"><span class="micro">Как это работает</span><p class="fine">01 Выберите вещи &nbsp; · &nbsp; 02 Укажите размер &nbsp; · &nbsp; 03 Поделитесь ссылкой</p></div></div></section>`;
if(state.page==='catalog')h=`${crumb('Выбор вещей')}<div class="kicker">НОВАЯ КОЛЛЕКЦИЯ</div><h1 class="h2">Выберите то, что нравится</h1><p class="lead" style="margin-bottom:33px">Откройте карточку вещи, выберите цвет и размер, затем добавьте её в вишлист.</p><div class="catalog">${products.map(x=>`<article class="tile" onclick="product(${x.id})" tabindex="0" onkeydown="if(event.key==='Enter')product(${x.id})">${img(x)}<div class="tile-name">${esc(x.name)}</div><div class="tile-price">${money(x.price)}</div><button class="linkish" style="margin-top:7px">Выбрать вещь →</button></article>`).join('')}</div>`;
if(state.page==='product')h=`${crumb('Коллекция / '+esc(p.name))}<div class="layout"><div class="product-photo">${img(p)}</div><div class="panel"><div class="kicker">LIMÉ · ЖЕНСКАЯ КОЛЛЕКЦИЯ</div><h1 class="h2">${esc(p.name)}</h1><div style="font-size:21px;margin-bottom:21px">${money(p.price)}</div><div class="fine">Вещь из демонстрационного каталога · данные примерные</div><div class="select-label"><span>ЦВЕТ</span><span>${state.color!==null?esc(p.colors[state.color][0]):'Выберите цвет'}</span></div><div class="swatches">${p.colors.map((c,i)=>`<button class="swatch ${state.color===i?'selected':''}" style="background:${c[1]}" title="${esc(c[0])}" aria-label="${esc(c[0])}" aria-pressed="${state.color===i}" onclick="setColor(${i})"></button>`).join('')}</div><div class="select-label"><span>РАЗМЕР</span><button class="linkish" onclick="toast('Для этого товара выберите привычный размер')">Как выбрать размер?</button></div><div class="sizes">${p.sizes.map(s=>`<button class="size ${state.size===s?'selected':''}" aria-pressed="${state.size===s}" onclick="setSize('${s}')">${s}</button>`).join('')}</div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<div style="margin-top:30px"><button class="btn" onclick="saveItem()">${state.editing?'СОХРАНИТЬ ИЗМЕНЕНИЯ':'ДОБАВИТЬ В ВИШЛИСТ ♡'}</button><button class="btn secondary" style="margin-top:10px" onclick="navigate('catalog')">Продолжить выбор</button></div><div class="notice">В списке сохраняются выбранные цвет и размер. Цена и наличие могут измениться к моменту покупки.</div></div></div>`;
if(state.page==='auth')h=`${crumb('Авторизация')}<div class="authcard"><div class="kicker">LIMÉ · ЛИЧНЫЙ КАБИНЕТ</div><h1 class="h2">Сохраните свой вишлист</h1><p class="lead" style="font-size:14px">Введите номер телефона, чтобы ваши желания сохранились в аккаунте LIMÉ.</p><label for="phone" class="micro">Номер телефона</label><input class="input" id="phone" type="tel" placeholder="+7 999 123-45-67" value="${state.phone?'+ '+state.phone:''}" onkeydown="if(event.key==='Enter')sendCode()">${state.error?`<div class="error">${esc(state.error)}</div>`:''}<button class="btn" style="margin-top:15px" onclick="sendCode()">ПОЛУЧИТЬ КОД</button><p class="fine">В демонстрации настоящее SMS не отправляется.</p></div>`;
if(state.page==='otp')h=`${crumb('Подтверждение номера')}<div class="authcard"><div class="kicker">ПРОВЕРКА НОМЕРА</div><h1 class="h2">Введите код</h1><p class="lead" style="font-size:14px">В реальном сервисе мы отправим код на номер +${esc(state.phone)}.</p><label for="code" class="micro">Код подтверждения</label><input class="input" id="code" inputmode="numeric" maxlength="4" placeholder="4 цифры" onkeydown="if(event.key==='Enter')checkCode()"><div class="notice">Код для тестирования: <strong>1234</strong></div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<button class="btn" style="margin-top:18px" onclick="checkCode()">ПОДТВЕРДИТЬ</button><button class="textbtn" style="margin-top:18px" onclick="navigate('auth')">Изменить номер телефона</button></div>`;
if(state.page==='wishlist')h=`${crumb('Мой вишлист')}<div class="kicker">ВАШИ ЖЕЛАНИЯ</div><h1 class="h2">Мой вишлист <span style="font:18px Arial;color:#888">(${state.items.length})</span></h1><p class="lead">Здесь собраны вещи, которые вам нравятся. Вы можете изменить параметры или убрать вещь из списка.</p>${state.items.length?`<div class="wish-grid">${state.items.map(i=>{const x=get(i.id);return `<article class="wish-card"><div class="mini-img">${img(x)}</div><div class="wish-content"><div>${esc(x.name)}</div><div class="fine" style="margin:8px 0">${esc(x.colors[i.color][0])} · размер ${esc(i.size)}</div><div>${money(x.price)}</div><div class="card-actions"><button class="linkish" onclick="editItem(${x.id})">Изменить</button><button class="linkish" onclick="removeItem(${x.id})">Удалить</button></div></div></article>`}).join('')}</div><div class="wish-actions"><div><span class="pill">♡ ${state.items.length} ${state.items.length===1?'желание':'желаний'}</span><p class="fine">Список сохраняется в этом браузере.</p></div><button class="btn" onclick="navigate('share')">ПОДЕЛИТЬСЯ ВИШЛИСТОМ →</button></div><button class="linkish" onclick="navigate('catalog')">+ Добавить ещё вещи</button>`:`<div class="empty"><h2 class="h2">Пока нет сохранённых вещей</h2><p>Откройте коллекцию и добавьте первую вещь в свой вишлист.</p><button class="btn" style="max-width:300px;margin-top:20px" onclick="navigate('catalog')">ВЫБРАТЬ ВЕЩЬ</button></div>`}`;
if(state.page==='share')h=`${crumb('Мой вишлист / Поделиться')}<div class="kicker">ВАШ СПИСОК ГОТОВ</div><h1 class="h2">Поделитесь желаниями</h1><p class="lead">Отправьте эту ссылку другу или близкому человеку. Он увидит выбранные вещи, цвета и размеры и сможет выбрать подарок.</p><div class="sharebox"><div class="micro">Ссылка на ваш вишлист</div><div class="urlbox" style="margin:16px 0">${esc(qs())}</div><div class="btnrow"><button class="btn" onclick="copyLink()">СКОПИРОВАТЬ ССЫЛКУ</button><button class="btn secondary" onclick="share()">ОТПРАВИТЬ</button></div><div style="margin-top:26px;border-top:1px solid #eee;padding-top:19px"><div class="micro">Доступ к списку</div><label style="display:block;margin-top:14px"><input type="radio" name="privacy" ${state.sharePublic?'checked':''} onchange="setPrivacy(true)"> Доступен всем, у кого есть ссылка</label><label style="display:block;margin-top:10px"><input type="radio" name="privacy" ${!state.sharePublic?'checked':''} onchange="setPrivacy(false)"> Только мне (не делиться)</label></div>${!state.sharePublic?'<div class="notice">Сейчас список скрыт от других. Чтобы даритель смог его открыть, разрешите доступ по ссылке.</div>':''}</div><div class="btnrow" style="max-width:680px"><button class="btn secondary" onclick="navigate('wishlist')">ВЕРНУТЬСЯ К СПИСКУ</button><button class="btn soft" onclick="navigate('gift')">ПОСМОТРЕТЬ КАК ДАРИТЕЛЬ →</button></div>`;
if(state.page==='gift'){const items=state.items;h=`<section class="gift-head"><div class="kicker">LIMÉ · ПОДАРКИ, КОТОРЫЕ ЖДУТ</div><h1 class="h1">Вишлист для близких</h1><p style="max-width:530px;margin:auto;color:#5c5a55">Здесь собраны вещи, которые хочется получить в подарок. Размер и цвет уже выбраны — осталось определиться с подарком.</p></section>${!state.sharePublic?`<div class="empty"><h2 class="h2">Список пока закрыт</h2><p>Владелец ещё не открыл доступ по ссылке.</p><button class="btn" style="max-width:300px" onclick="navigate('share')">НАСТРОИТЬ ДОСТУП</button></div>`:!items.length?`<div class="empty"><h2 class="h2">Список пока пуст</h2><p>Владелец ещё не добавил вещи.</p><button class="btn" style="max-width:300px" onclick="navigate('catalog')">ПЕРЕЙТИ К КОЛЛЕКЦИИ</button></div>`:`<div class="micro">ВЫБЕРИТЕ ПОДАРОК · ${items.length} В СПИСКЕ</div><div class="wish-grid">${items.map(i=>{const x=get(i.id);return `<article class="wish-card"><div class="mini-img">${img(x)}</div><div class="wish-content"><div>${esc(x.name)}</div><div class="fine" style="margin:8px 0">${esc(x.colors[i.color][0])} · размер ${esc(i.size)}</div><div>${money(x.price)}</div><button class="btn" style="margin-top:17px" onclick="viewGiftItem(${x.id})">ВЫБРАТЬ ПОДАРОК</button></div></article>`}).join('')}</div>`}`}
if(state.page==='gift-item'){const x=get(state.giftItem)||products[0],i=state.items.find(z=>z.id===x.id);h=`${crumb('Вишлист / '+esc(x.name))}<div class="layout"><div class="product-photo">${img(x)}</div><div class="panel"><div class="kicker">ПОДАРОК ИЗ ВИШЛИСТА</div><h1 class="h2">${esc(x.name)}</h1><div style="font-size:22px">${money(x.price)}</div><div class="stepbox"><div class="micro">Получатель выбрал</div><p><strong>Цвет:</strong> ${i?esc(x.colors[i.color][0]):'—'}</p><p><strong>Размер:</strong> ${i?esc(i.size):'—'}</p><p class="fine">Параметры зафиксированы владельцем вишлиста — вам не нужно их угадывать.</p></div><div class="select-label">НАЛИЧИЕ</div><div class="pill" style="background:${state.unavailable?'#f8e9e7':'#e5ece3'}">${state.unavailable?'Нет в наличии':'Доступно к оформлению · демо'}</div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<button class="btn" style="margin-top:26px" onclick="goCheckout()">КУПИТЬ В LIMÉ</button><button class="btn secondary" style="margin-top:10px" onclick="navigate('gift')">ВЕРНУТЬСЯ К ВИШЛИСТУ</button><div class="notice">Тестовый сценарий: <button class="linkish" onclick="state.unavailable=!state.unavailable;state.error='';render()">${state.unavailable?'Вернуть товар в наличие':'Показать ситуацию «Нет в наличии»'}</button></div></div></div>`}
if(state.page==='checkout'){const x=get(state.giftItem)||products[0],i=state.items.find(z=>z.id===x.id);h=`${crumb('Оформление заказа')}<h1 class="h2" style="margin-bottom:36px">Оформление подарка</h1><div class="checkout"><section><div class="kicker">КОНТАКТНЫЕ ДАННЫЕ</div><label class="micro" for="buyer-name">Ваше имя</label><input class="input" id="buyer-name" placeholder="Как к вам обращаться"><label class="micro" for="buyer-email">Электронная почта</label><input class="input" type="email" id="buyer-email" placeholder="example@mail.ru"><div class="kicker" style="margin-top:28px">ДОСТАВКА</div><label class="micro" for="address">Адрес доставки</label><input class="input" id="address" placeholder="Город, улица, дом, квартира"><p class="fine">Этот заказ демонстрационный: платёж и доставка не выполняются.</p><label class="checkline"><input type="checkbox" id="agree"><span>Подтверждаю, что данные введены для теста прототипа, а не для реального заказа.</span></label>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<button class="btn" onclick="submitOrder()">ОФОРМИТЬ ДЕМО-ЗАКАЗ</button><button class="textbtn" style="margin-top:15px" onclick="navigate('gift-item')">← Вернуться к подарку</button></section><aside class="summary"><div class="kicker">ВАШ ЗАКАЗ</div><div class="order-row"><div class="mini-img">${img(x)}</div><div><div>${esc(x.name)}</div><p class="fine">${i?esc(x.colors[i.color][0])+' · '+esc(i.size):''}</p><strong>${money(x.price)}</strong></div></div><div class="total"><span>Итого</span><strong>${money(x.price)}</strong></div><p class="fine" style="margin-top:20px">Доставка и оплата не рассчитываются в прототипе.</p></aside></div>`}
if(state.page==='done')h=`<div class="done"><div class="done-symbol">♡</div><div class="kicker">ЗАКАЗ СОЗДАН · ДЕМОНСТРАЦИЯ</div><h1 class="h1">Подарок выбран</h1><p class="lead" style="margin:0 auto 28px">Вы успешно прошли весь путь от получения вишлиста до оформления подарка. В реальном магазине здесь появилось бы подтверждение заказа и информация о доставке.</p><button class="btn" style="max-width:320px" onclick="navigate('gift')">ВЕРНУТЬСЯ К ВИШЛИСТУ</button><p class="fine" style="margin-top:20px">Никакого реального заказа или списания средств не произошло.</p></div>`;
a.innerHTML=h}
const urlParams=new URLSearchParams(location.search);if(urlParams.get('view')==='gift'){state.page='gift';if(urlParams.has('items')){try{const incoming=JSON.parse(urlParams.get('items'));if(Array.isArray(incoming)){state.items=incoming.filter(i=>get(i.id)&&get(i.id).colors[i.color]&&get(i.id).sizes.includes(i.size));state.sharePublic=true}}catch(e){}}}render();
</script></body></html>
